# 통합 테스트용 인메모리 DB.
#
# Docker 가 없어 Testcontainers 를 못 쓴다. H2 를 PostgreSQL 호환 모드로 띄우되,
# 리포지토리에 `todo.` 스키마가 하드코딩된 네이티브 쿼리가 8건 있으므로 스키마를 미리 만든다.
# (DB_CLOSE_DELAY=-1 이 없으면 커넥션이 끊길 때 DB 가 통째로 사라진다)
spring.datasource.url=jdbc:h2:mem:plando;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS todo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=todo
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 외부 연동은 테스트에서 전부 비활성 — 없으면 컨텍스트가 안 뜬다
sentry.dsn=
spring.mail.host=localhost
spring.mail.port=3025
app.frontend-url=http://localhost:5173
app.mail.from=test@plando.local

jwt.secret=test-secret-key-for-integration-tests-only-not-used-in-production-0123456789

# ── 외부 연동 자격증명 더미 ─────────────────────────────────────
# application.properties(기본 프로필)에 기본값 없는 ${...} 들이 있어, 값을 주지 않으면
# 컨텍스트가 아예 뜨지 않는다. 테스트는 외부 연동을 실제로 호출하지 않으므로 자리만 채운다.
# (진짜 값이 여기 들어가면 안 된다 — 저장소에 커밋되는 파일이다)
GMAIL_APP_PASSWORD=test-not-used
GOOGLE_CLIENT_ID=test-not-used
GOOGLE_CLIENT_SECRET=test-not-used
JWT_SECRET=test-secret-key-for-integration-tests-only-0123456789abcdef
KAKAO_REST_KEY=test-not-used
KAKAO_CLIENT_SECRET=test-not-used
OPENAI_API_KEY=test-not-used
VAPID_PRIVATE_KEY=test-not-used
VAPID_PUBLIC_KEY=test-not-used
DB_PASSWORD=test-not-used
APNS_KEY_CONTENT=
APNS_KEY_ID=
APNS_KEY_PATH=
APNS_TEAM_ID=
