# Plan Do! 백엔드 설정 예시
#
# 실제 설정 파일(application.properties, application-*.properties)은 공개 저장소에 넣지 않았습니다.
# 이 파일을 application.properties 로 복사한 뒤, ${...} 자리는 환경변수로 채워 주세요.
# 외부 연동(OAuth, 메일, OpenAI, 웹 푸시, APNs, Sentry)은 값이 비어 있으면 해당 기능만 동작하지 않습니다.

spring.application.name=todo
server.port=8080

# ── DB (PostgreSQL, schema=todo) ─────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=todo
# 로컬은 update, 운영은 validate (스키마 변경은 backend/sql/ 의 마이그레이션으로 먼저 적용)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── 업로드 ───────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# ── 인증 ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.apple.bundle-id=${APPLE_BUNDLE_ID:com.example.plando}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.scope=${KAKAO_SCOPE:profile_nickname,profile_image,account_email}
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ── 지도 (카카오 REST: 경로·장소 조회) ──────────────────────────
kakao.maps.api-key=${KAKAO_REST_KEY}

# ── AI (Spring AI + OpenAI) ──────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
llm.model=${OPENAI_MODEL:gpt-4o-mini}
llm.maxOutputTokens=${LLM_MAX_OUTPUT_TOKENS:800}
ai.daily-limit=${AI_DAILY_LIMIT:30}
spring.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=${AI_RETRY_INITIAL_INTERVAL:2s}
spring.ai.retry.backoff.multiplier=${AI_RETRY_MULTIPLIER:2}
spring.ai.retry.backoff.max-interval=${AI_RETRY_MAX_INTERVAL:10s}
spring.ai.retry.on-client-errors=false
spring.http.client.connect-timeout=${HTTP_CONNECT_TIMEOUT:10s}
spring.http.client.read-timeout=${HTTP_READ_TIMEOUT:60s}
# 음성 합성 자동 설정은 쓰지 않습니다
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration

# 비로그인 AI 데모 엔드포인트 (한도는 환경에 맞게)
demo.assistant.enabled=${DEMO_ASSISTANT_ENABLED:false}
demo.assistant.max-tokens=${DEMO_ASSISTANT_MAX_TOKENS:500}
demo.assistant.max-message-length=${DEMO_ASSISTANT_MAX_MESSAGE_LENGTH:300}
demo.assistant.rate-per-minute=${DEMO_ASSISTANT_RATE_PER_MINUTE:5}
demo.assistant.rate-per-day=${DEMO_ASSISTANT_RATE_PER_DAY:30}
demo.assistant.daily-budget=${DEMO_ASSISTANT_DAILY_BUDGET:200}

# ── 메일 (이메일 인증·비밀번호 재설정) ──────────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@example.com}

# ── 웹 푸시 (VAPID) ──────────────────────────────────────────
webpush.vapid.public-key=${VAPID_PUBLIC_KEY}
webpush.vapid.private-key=${VAPID_PRIVATE_KEY}
webpush.vapid.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# ── iOS 푸시 (APNs) ──────────────────────────────────────────
apns.bundle-id=${APNS_BUNDLE_ID:com.example.plando}
apns.team-id=${APNS_TEAM_ID:}
apns.key-id=${APNS_KEY_ID:}
apns.key-path=${APNS_KEY_PATH:}
apns.key-content=${APNS_KEY_CONTENT:}
apns.production=${APNS_PRODUCTION:false}

# ── 에러 추적 (Sentry, DSN 이 비어 있으면 비활성) ─────────────────
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.send-default-pii=false
sentry.release=${SENTRY_RELEASE:}

# ── 로그 ─────────────────────────────────────────────────────
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
